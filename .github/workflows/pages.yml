name: Deploy NORTH to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Check types and reviewed content
        run: |
          npx tsc --noEmit
          node scripts/check-content.mjs
          node scripts/check-residents.mjs
          node scripts/check-street-simulation.mjs
          node scripts/check-street-entities.mjs
          node scripts/check-diorama.mjs
      - name: Build static explorer
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Check packaged assets
        run: node scripts/check-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static explorer
        id: deployment
        uses: actions/deploy-pages@v4
